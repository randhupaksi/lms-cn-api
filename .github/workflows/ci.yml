name: API CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build API
        run: go build -o "$RUNNER_TEMP/lms-cn-api" ./cmd/api

  mysql-integration:
    name: MySQL migrations and school workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
          MYSQL_DATABASE: lms_ci_test
          MYSQL_USER: lms_ci
          MYSQL_PASSWORD: synthetic-ci-fixture
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test against the disposable fixture
        env:
          LMS_INTEGRATION_TEST_DSN: lms_ci:synthetic-ci-fixture@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/lms_ci_test?parseTime=true
        run: go test -v -count=1 ./tests/integration
